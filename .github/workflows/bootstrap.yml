name: Bootstrap v1.0.0
on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.txt > /tmp/bundle.b64
          base64 --decode /tmp/bundle.b64 > /tmp/bundle.zip
          rm -rf /tmp/source && mkdir -p /tmp/source
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/bundle.zip') as z:
              z.extractall('/tmp/source')
          PY
          rsync -a --exclude '.github/workflows/' /tmp/source/ ./
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish v1.0.0"
          git push origin HEAD:main
